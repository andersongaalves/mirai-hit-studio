<!doctype html>
<html lang="{{ 'pt-BR' if idioma == 'pt' else 'en' }}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mirai Hit Labs</title>
    <style>
        body { margin: 0; padding: 0; background: #f4f4f5; color: #111111; font-family: Arial, Helvetica, sans-serif; line-height: 1.55; }
        .wrap { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
        .card { background: #ffffff; border: 1px solid #e4e4e7; border-radius: 16px; padding: 32px 28px; }
        .brand { margin: 0 0 24px; font-size: 13px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; }
        h1 { margin: 0 0 16px; font-size: 22px; line-height: 1.3; }
        p { margin: 0 0 14px; font-size: 15px; }
        .button { display: inline-block; padding: 14px 26px; border-radius: 999px; background: #111111; color: #ffffff !important; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; }
        .muted { color: #52525b; font-size: 13px; }
        .foot { margin-top: 20px; color: #71717a; font-size: 12px; text-align: center; }
        .foot a { color: #71717a; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <p class="brand">Mirai Hit Labs</p>
            {% block content %}{% endblock %}
        </div>
        <p class="foot">
            {% if idioma == 'pt' %}Plugins de áudio da Mirai Hit Studio{% else %}Audio plugins by Mirai Hit Studio{% endif %}
            · <a href="{{ labs_url }}">{{ labs_url | replace('https://', '') }}</a>
            · © {{ ano }}
        </p>
    </div>
</body>
</html>
