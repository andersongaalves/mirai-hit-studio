name: Database backup

on:
    schedule:
        - cron: "17 3 * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: production-database-backup
    cancel-in-progress: false

jobs:
    backup:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
            BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
            AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION: auto
            R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
            R2_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version-file: backend/.python-version
                  cache: pip
                  cache-dependency-path: backend/requirements.txt

            - name: Validate configuration names
              shell: bash
              run: |
                  set -euo pipefail
                  for name in DATABASE_URL BACKUP_ENCRYPTION_PASSPHRASE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
                    if [[ -z "${!name:-}" ]]; then
                      echo "backup_configuration_missing: ${name}" >&2
                      exit 1
                    fi
                  done
                  if [[ ${#BACKUP_ENCRYPTION_PASSPHRASE} -lt 32 ]]; then
                    echo "backup_encryption_passphrase_too_short" >&2
                    exit 1
                  fi
                  if [[ ! "$R2_ENDPOINT" =~ ^https://[a-f0-9]{32}\.r2\.cloudflarestorage\.com/?$ ]]; then
                    echo "backup_r2_endpoint_invalid" >&2
                    exit 1
                  fi
                  if [[ ! "$R2_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
                    echo "backup_r2_bucket_invalid" >&2
                    exit 1
                  fi

            - name: Install PostgreSQL 17 client
              shell: bash
              run: |
                  set -euo pipefail
                  sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
                  curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
                    | gpg --dearmor \
                    | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg >/dev/null
                  . /etc/os-release
                  echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
                    | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
                  sudo apt-get update -qq
                  sudo apt-get install -y --no-install-recommends postgresql-client-17 gnupg
                  pg_dump --version
                  pg_restore --version
                  aws --version

            - name: Install backup script dependency
              shell: bash
              run: python -m pip install --disable-pip-version-check SQLAlchemy==2.0.51

            - name: Create, validate and encrypt dump
              id: archive
              working-directory: backend
              shell: bash
              run: |
                  set -euo pipefail
                  output_dir="$RUNNER_TEMP/mirai-backup"
                  mkdir -p "$output_dir"
                  python -m scripts.backup_database --output-dir "$output_dir"
                  dump_file="$(find "$output_dir" -maxdepth 1 -type f -name 'mirai_*.dump' -print -quit)"
                  if [[ -z "$dump_file" ]]; then
                    echo "backup_dump_missing" >&2
                    exit 1
                  fi
                  pg_restore --list "$dump_file" >/dev/null

                  encrypted_file="${dump_file}.gpg"
                  printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" \
                    | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                        --symmetric --cipher-algo AES256 --output "$encrypted_file" "$dump_file"

                  verification_file="$output_dir/verification.dump"
                  printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" \
                    | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                        --decrypt --output "$verification_file" "$encrypted_file"
                  pg_restore --list "$verification_file" >/dev/null
                  rm -f "$dump_file" "$verification_file"

                  checksum_file="${encrypted_file}.sha256"
                  (cd "$output_dir" && sha256sum "$(basename "$encrypted_file")") > "$checksum_file"
                  object_key="daily/$(basename "$encrypted_file")"
                  echo "encrypted_file=$encrypted_file" >> "$GITHUB_OUTPUT"
                  echo "checksum_file=$checksum_file" >> "$GITHUB_OUTPUT"
                  echo "object_key=$object_key" >> "$GITHUB_OUTPUT"

            - name: Upload and verify private R2 object
              shell: bash
              run: |
                  set -euo pipefail
                  encrypted_file="${{ steps.archive.outputs.encrypted_file }}"
                  checksum_file="${{ steps.archive.outputs.checksum_file }}"
                  object_key="${{ steps.archive.outputs.object_key }}"
                  aws s3 cp "$encrypted_file" "s3://${R2_BUCKET}/${object_key}" \
                    --endpoint-url "$R2_ENDPOINT" --only-show-errors
                  aws s3 cp "$checksum_file" "s3://${R2_BUCKET}/${object_key}.sha256" \
                    --endpoint-url "$R2_ENDPOINT" --only-show-errors
                  local_size="$(stat -c '%s' "$encrypted_file")"
                  remote_size="$(aws s3api head-object --bucket "$R2_BUCKET" --key "$object_key" \
                    --endpoint-url "$R2_ENDPOINT" --query ContentLength --output text)"
                  if [[ "$local_size" != "$remote_size" ]]; then
                    echo "backup_remote_size_mismatch" >&2
                    exit 1
                  fi
                  {
                    echo "### Database backup"
                    echo "- Object: \`$object_key\`"
                    echo "- Encrypted bytes: \`$remote_size\`"
                    echo "- Archive validation: passed"
                    echo "- Remote verification: passed"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Remove temporary backup material
              if: always()
              shell: bash
              run: rm -rf "$RUNNER_TEMP/mirai-backup"
