name: TEMP diagnose

on:
    push:
        branches: [feat/s11-notificacoes-admin]

permissions:
    contents: read

jobs:
    diag:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            APP_ENV: test
            DATABASE_URL: postgresql+psycopg2://mirai_integration:mirai_integration_disposable@127.0.0.1:5432/mirai_portals_e2e_storage
            MIRAI_PORTALS_E2E_DATABASE_URL: postgresql+psycopg2://mirai_integration:mirai_integration_disposable@127.0.0.1:5432/mirai_portals_e2e_storage
            MIRAI_PORTALS_E2E_ALLOW: POSTGRES_17_DISPOSABLE_ONLY
            API_NAME: Mirai storage integration
            API_VERSION: "2.0"
            DEBUG: "false"
            HOST: 127.0.0.1
            PORT: "8000"
            LOG_LEVEL: WARNING
            SECRET_KEY: storage-integration-only-secret
            ALGORITHM: HS256
            ACCESS_TOKEN_EXPIRE_MINUTES: "30"
            REFRESH_TOKEN_EXPIRE_DAYS: "7"
            ALLOWED_ORIGINS: http://localhost:4173
            BACKUP_FOLDER: /tmp/mirai-storage-integration
            BACKUP_KEEP_DAYS: "1"
            RATE_LIMIT_DB: /tmp/mirai-storage-integration-rate.sqlite3
            RESEND_API_KEY: test-only
            EMAIL_FROM: storage-integration@example.invalid
            ADMIN_EMAIL: storage-integration@example.invalid
            PUBLIC_API_URL: http://127.0.0.1:8000
            PUBLIC_FRONTEND_URL: http://localhost:4173
            AI_ENABLED: "false"
            AI_EMAIL_ENABLED: "false"
            # Disposable CI fixture for legacy-mode regression, not the Render runtime state.
            COMMERCIAL_PIPELINE_V2_ENABLED: "false"
            PUBLIC_IMAGE_STORAGE_BACKEND: memory
            PORTFOLIO_AUDIO_STORAGE_BACKEND: memory
            PRODUCTION_TEMP_STORAGE_BACKEND: memory
            PRODUCTION_FINAL_STORAGE_BACKEND: memory
            PROPOSAL_DOCUMENT_STORAGE_BACKEND: legacy

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version-file: backend/.python-version
            - run: python -m pip install --disable-pip-version-check -r backend/requirements-test.txt
            - name: Diagnose
              working-directory: backend
              shell: bash
              run: |
                  set +e
                  for pattern in test_storage_core.py test_producao_r2_storage.py test_portfolio_image_storage.py test_portfolio_audio_storage_core.py test_storage_lifecycle.py test_storage_migration.py test_storage_preflight.py test_storage_environment_guard.py test_production_release_guard.py test_production_release_workflow.py test_storage_evidence.py test_storage_provider_smoke.py test_ci_postgres_workflows.py test_portfolio_mix_comparison.py; do
                    python -m unittest discover -s tests -p "$pattern" > out.txt 2>&1
                    if [ $? -ne 0 ]; then
                      echo "::error::DIAG FILE $pattern"
                      python3 -c "t=open('out.txt').read(); i=t.find('Traceback'); print(t[i:i+3000])" | tr '\n' ' ' | fold -w 900 | while read -r line; do echo "::error::DIAG $line"; done
                      break
                    fi
                  done
                  exit 1
