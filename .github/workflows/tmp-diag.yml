name: TEMP diagnose

on:
    push:
        branches: [fix/s01-acessibilidade]

permissions:
    contents: read

jobs:
    a11y:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - name: Install Playwright
              run: |
                  npm install --no-save --no-package-lock playwright@1.55.0
                  npx playwright install --with-deps chromium
            - name: Diagnose
              shell: bash
              run: |
                  set +e
                  node frontend/tests/public_accessibility.cjs > out.txt 2>&1
                  code=$?
                  head -c 6000 out.txt | tr '\n' ' ' | fold -w 900 | while read -r line; do echo "::error::DIAG $line"; done
                  exit $code
