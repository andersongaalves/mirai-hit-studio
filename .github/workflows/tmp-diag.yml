name: TEMP diagnose

on:
    push:
        branches: [fix/s03-orcamento-preco]

permissions:
    contents: read

jobs:
    diag:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            APP_ENV: test
            DATABASE_URL: postgresql+psycopg2://mirai_integration:mirai_integration_disposable@127.0.0.1:5432/mirai_portals_e2e_storage
            MIRAI_PORTALS_E2E_DATABASE_URL: postgresql+psycopg2://mirai_integration:mirai_integration_disposable@127.0.0.1:5432/mirai_portals_e2e_storage
            MIRAI_PORTALS_E2E_ALLOW: POSTGRES_17_DISPOSABLE_ONLY
            API_NAME: Mirai storage integration
            API_VERSION: "2.0"
            DEBUG: "false"
            HOST: 127.0.0.1
            PORT: "8000"
            LOG_LEVEL: WARNING
            SECRET_KEY: storage-integration-only-secret
            ALGORITHM: HS256
            ACCESS_TOKEN_EXPIRE_MINUTES: "30"
            REFRESH_TOKEN_EXPIRE_DAYS: "7"
            ALLOWED_ORIGINS: http://localhost:4173
            BACKUP_FOLDER: /tmp/mirai-storage-integration
            BACKUP_KEEP_DAYS: "1"
            RATE_LIMIT_DB: /tmp/mirai-storage-integration-rate.sqlite3
            RESEND_API_KEY: test-only
            EMAIL_FROM: storage-integration@example.invalid
            ADMIN_EMAIL: storage-integration@example.invalid
            PUBLIC_API_URL: http://127.0.0.1:8000
            PUBLIC_FRONTEND_URL: http://localhost:4173
            AI_ENABLED: "false"
            AI_EMAIL_ENABLED: "false"
            # Disposable CI fixture for legacy-mode regression, not the Render runtime state.
            COMMERCIAL_PIPELINE_V2_ENABLED: "false"
            PUBLIC_IMAGE_STORAGE_BACKEND: memory
            PORTFOLIO_AUDIO_STORAGE_BACKEND: memory
            PRODUCTION_TEMP_STORAGE_BACKEND: memory
            PRODUCTION_FINAL_STORAGE_BACKEND: memory
            PROPOSAL_DOCUMENT_STORAGE_BACKEND: legacy


        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version-file: backend/.python-version
            - name: TEMP diagnose
              working-directory: backend
              shell: bash
              run: |
                  python -m pip install --disable-pip-version-check -q -r requirements-test.txt
                  for pattern in test_commerce_domain.py test_proposta_*.py test_financeiro.py test_checkout.py test_mercado_pago.py test_mercado_pago_webhooks.py test_commercial_journey_i2.py test_portal_cliente.py test_client_access.py test_client_signup.py test_security_phase_e.py test_password_recovery.py test_catalogo.py test_promocoes.py test_combos.py; do
                    if ! python -m unittest discover -s tests -p "$pattern" > /tmp/out.txt 2>&1; then
                      body=$(grep -v "^ok$" /tmp/out.txt | tail -n 80 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
                      echo "::error::DIAG $pattern%0A$body"
                    fi
                  done
