name: TEMP diagnose

on:
    push:
        branches: [docs/etapa07-lote2-publicado]

permissions:
    contents: read

jobs:
    diag:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version-file: backend/.python-version
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - name: Install
              run: |
                  python -m pip install --disable-pip-version-check -q -r backend/requirements-test.txt
                  npm install --no-save --no-package-lock playwright@1.55.0
                  npx playwright install --with-deps chromium
            - name: TEMP diagnose
              shell: bash
              run: |
                  for t in frontend/tests/portfolio_admin.cjs frontend/tests/portfolio_submissions.cjs frontend/tests/audio_tags.cjs frontend/tests/service_credits.cjs frontend/tests/credit_allocations.cjs frontend/tests/stage_payouts.cjs frontend/tests/producoes.cjs frontend/tests/financeiro_admin.cjs frontend/tests/beat_preview.cjs frontend/tests/portfolio_public.cjs frontend/tests/home_artists.cjs frontend/tests/home_mix_comparison.cjs frontend/tests/portal_produtor.cjs frontend/tests/portal_cliente.cjs frontend/tests/admin_beat_licenses.cjs frontend/tests/checkout.cjs frontend/tests/public_contracting.cjs frontend/tests/proposta_comercial.cjs frontend/tests/usuarios.cjs frontend/tests/client_signup.cjs frontend/tests/portal_settings_admin.cjs frontend/tests/servico_etapas_admin.cjs frontend/tests/proposta_editor.cjs frontend/tests/proposta_catalogo.cjs frontend/tests/combos_admin.cjs frontend/tests/file_quotas.cjs frontend/tests/policies.cjs frontend/tests/catalogo.cjs frontend/tests/promocoes.cjs frontend/tests/portal_notifications.cjs frontend/tests/production_stages_admin.cjs frontend/tests/image_crop.cjs ; do
                    if ! node "$t" > /tmp/out.txt 2>&1; then
                      body=$(tail -n 60 /tmp/out.txt | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
                      echo "::error::DIAG $t%0A$body"
                    fi
                  done
