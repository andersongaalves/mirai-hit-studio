name: Client access migration PostgreSQL 17

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - ".github/workflows/client-access-migration.yml"
            - "backend/migrations/versions/*client_access*"
            - "backend/migrations/versions/*auth_version*"
            - "backend/models/client_access.py"
            - "backend/models/usuario.py"
            - "backend/models/__init__.py"
            - "backend/tests/test_client_access_migration_postgres.py"

permissions:
    contents: read

concurrency:
    group: client-access-migration-${{ github.ref }}
    cancel-in-progress: true

jobs:
    migration-cycle:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_DB: mirai_portals_e2e
                    POSTGRES_USER: mirai_e2e
                    POSTGRES_PASSWORD: mirai_e2e_disposable
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U mirai_e2e -d mirai_portals_e2e"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        env:
            APP_ENV: test
            DATABASE_URL: postgresql+psycopg2://mirai_e2e:mirai_e2e_disposable@127.0.0.1:5432/mirai_portals_e2e
            MIRAI_PORTALS_E2E_DATABASE_URL: postgresql+psycopg2://mirai_e2e:mirai_e2e_disposable@127.0.0.1:5432/mirai_portals_e2e
            MIRAI_PORTALS_E2E_ALLOW: POSTGRES_17_DISPOSABLE_ONLY
            API_NAME: Mirai client access migration E2E
            API_VERSION: "2.0"
            DEBUG: "false"
            HOST: 127.0.0.1
            PORT: "8000"
            LOG_LEVEL: WARNING
            SECRET_KEY: migration-e2e-only-secret
            ALGORITHM: HS256
            ACCESS_TOKEN_EXPIRE_MINUTES: "30"
            REFRESH_TOKEN_EXPIRE_DAYS: "7"
            ALLOWED_ORIGINS: http://localhost:4173
            BACKUP_FOLDER: /tmp/mirai-client-access-e2e
            BACKUP_KEEP_DAYS: "1"
            EMAIL_FROM: migration-e2e@example.invalid
            ADMIN_EMAIL: migration-e2e@example.invalid

        steps:
            - name: Check out source
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version-file: backend/.python-version
                  cache: pip
                  cache-dependency-path: |
                      backend/requirements.txt
                      backend/requirements-test.txt

            - name: Install dependencies
              run: |
                  set -euo pipefail
                  python -m pip install --disable-pip-version-check -r backend/requirements-test.txt
                  python -m pip install --disable-pip-version-check ruff==0.16.9

            - name: Prepare disposable PostgreSQL 17
              working-directory: backend
              env:
                  PGPASSWORD: mirai_e2e_disposable
              run: |
                  set -euo pipefail
                  psql --host 127.0.0.1 --username mirai_e2e --dbname mirai_portals_e2e --set ON_ERROR_STOP=1 <<'SQL'
                  DO $$ BEGIN
                    IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
                      CREATE ROLE anon NOLOGIN;
                    END IF;
                    IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
                      CREATE ROLE authenticated NOLOGIN;
                    END IF;
                  END $$;
                  SQL
                  python -m scripts.bootstrap_database

            - name: Validate migration cycle, constraints and concurrency
              working-directory: backend
              run: |
                  set -euo pipefail
                  python -m unittest discover -s tests -p 'test_client_access_migration_postgres.py' -v

            - name: Run focused static checks
              run: |
                  set -euo pipefail
                  ruff check backend/tests/test_client_access_migration_postgres.py
                  ruff check backend/migrations/versions/a41b7d8de6d7_add_client_access_lifecycle.py
                  ruff check backend/migrations/versions/b3e6f9a2c741_add_usuario_auth_version.py
                  ruff check backend/models/client_access.py
                  ruff check backend/models/usuario.py
                  git diff --check
