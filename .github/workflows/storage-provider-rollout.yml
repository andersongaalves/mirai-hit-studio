name: Storage Provider Rollout Evidence

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact main commit being evaluated; must equal this workflow run SHA
        required: true
        type: string
      authorization_ref:
        description: CTRL approval reference, e.g. CTRL-1234
        required: true
        type: string
      confirm_real_smokes:
        description: Explicitly authorize disposable real-provider smoke writes and cleanup
        required: true
        type: choice
        options: ['no', 'yes']
      smoke_scope:
        description: Only legacy Storage diagnostics, or the full explicitly authorized provider set
        required: true
        type: choice
        default: legacy_only
        options: ['legacy_only', 'all']

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: storage-provider-rollout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trusted-request-guard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out only the trusted main workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate exact source, target, and authorization
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
          SMOKE_SCOPE: ${{ inputs.smoke_scope }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/storage-provider-rollout.yml@refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$TARGET_SHA" = "$GITHUB_SHA"
          [[ "$AUTHORIZATION_REF" =~ ^CTRL-[A-Za-z0-9._-]{3,100}$ ]]
          case "$SMOKE_SCOPE" in legacy_only|all) ;; *) exit 1 ;; esac
      - name: Require pre-existing protected rollout Environment
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: backend
        run: >-
          python -m scripts.storage_environment_guard
          --environment storage-rollout
          --solo-admin-reviewer "$GITHUB_REPOSITORY_OWNER"

  provider-smokes-and-signature:
    needs: trusted-request-guard
    if: >-
      needs.trusted-request-guard.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_real_smokes == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: storage-rollout
    env:
      APP_ENV: storage-smoke
      STORAGE_PREFLIGHT_TARGET_SHA: ${{ inputs.target_sha }}
      STORAGE_ROLLOUT_AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
    steps:
      - name: Check out the exact trusted main SHA, never the candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify pinned smoke, signer, and verifier source
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          echo 'dcf73cedd95a837fadfae57c5e6a9269e5ddea586b008013b492435bdec44a02  scripts/storage_provider_smoke.py' | /usr/bin/sha256sum --check --status
          echo 'acbc9ad7c6070da81e600e9f8c0d848e5fd075cbb9201fe610d88282ac1d62f0  scripts/storage_evidence.py' | /usr/bin/sha256sum --check --status
          echo '1d11ea3a05cac04aff727ec41509a66310991f60955214ff0eb609055f13269f  scripts/storage_preflight.py' | /usr/bin/sha256sum --check --status
      - name: Assert release and provider configuration
        shell: bash
        env:
          COMMERCIAL_PIPELINE_V2_ENABLED: ${{ vars.COMMERCIAL_PIPELINE_V2_ENABLED }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$STORAGE_PREFLIGHT_TARGET_SHA" = "$GITHUB_SHA"
          test "$COMMERCIAL_PIPELINE_V2_ENABLED" = "false"
      - name: Create short-lived Ruleset inspection token
        id: ruleset-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.STORAGE_GUARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.STORAGE_GUARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: mirai-hit-studio
          permission-administration: write
      - name: Verify protected Environments and main Ruleset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_RULESET_TOKEN: ${{ steps.ruleset-token.outputs.token }}
        working-directory: backend
        run: >-
          python -m scripts.storage_environment_guard
          --environment storage-rollout
          --solo-admin-reviewer "$GITHUB_REPOSITORY_OWNER"
          --require-main-protection
          --required-check storage-integration
      - name: Set up Python
        uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install trusted backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run legacy-only diagnostic and independent cleanup
        id: legacy-smoke
        if: inputs.smoke_scope == 'legacy_only'
        working-directory: backend
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCAO_STORAGE_BUCKET: ${{ vars.PRODUCAO_STORAGE_BUCKET }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
        run: >-
          python -m scripts.storage_provider_smoke
          --scope legacy_only
          --output /tmp/storage-smoke.json
          --diagnostic-output /tmp/storage-smoke-diagnostic.json
      - name: Run bounded real-provider smoke and cleanup
        id: all-smokes
        if: inputs.smoke_scope == 'all'
        working-directory: backend
        env:
          COMMERCIAL_PIPELINE_V2_ENABLED: ${{ vars.COMMERCIAL_PIPELINE_V2_ENABLED }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
          R2_PRESIGN_MAX_SECONDS: ${{ vars.R2_PRESIGN_MAX_SECONDS || '900' }}
          R2_TEMP_BUCKET: ${{ vars.R2_TEMP_BUCKET }}
          R2_FINAL_BUCKET: ${{ vars.R2_FINAL_BUCKET }}
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PORTFOLIO_AUDIO_STORAGE_BUCKET: ${{ vars.PORTFOLIO_AUDIO_STORAGE_BUCKET }}
          PRODUCAO_STORAGE_BUCKET: ${{ vars.PRODUCAO_STORAGE_BUCKET }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
          PROPOSTA_STORAGE_BACKEND: ${{ vars.PROPOSTA_STORAGE_BACKEND }}
          PRODUCTION_TEMP_STORAGE_BACKEND: ${{ vars.PRODUCTION_TEMP_STORAGE_BACKEND }}
          PRODUCTION_FINAL_STORAGE_BACKEND: ${{ vars.PRODUCTION_FINAL_STORAGE_BACKEND }}
          PUBLIC_IMAGE_STORAGE_BACKEND: ${{ vars.PUBLIC_IMAGE_STORAGE_BACKEND }}
          PORTFOLIO_AUDIO_STORAGE_BACKEND: ${{ vars.PORTFOLIO_AUDIO_STORAGE_BACKEND }}
          PROPOSAL_DOCUMENT_STORAGE_BACKEND: ${{ vars.PROPOSAL_DOCUMENT_STORAGE_BACKEND || 'legacy' }}
        run: >-
          python -m scripts.storage_provider_smoke
          --scope all
          --output /tmp/storage-smoke.json
          --diagnostic-output /tmp/storage-smoke-diagnostic.json
      - name: Publish sanitized smoke diagnostics
        if: >-
          !cancelled() &&
          (steps.legacy-smoke.outcome == 'success' ||
           steps.legacy-smoke.outcome == 'failure' ||
           steps.all-smokes.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: storage-rollout-diagnostic-${{ github.run_id }}
          path: /tmp/storage-smoke-diagnostic.json
          retention-days: 1
          if-no-files-found: error
      - name: Recheck pinned signer and verifier immediately before secret access
        if: inputs.smoke_scope == 'all'
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          echo 'acbc9ad7c6070da81e600e9f8c0d848e5fd075cbb9201fe610d88282ac1d62f0  scripts/storage_evidence.py' | /usr/bin/sha256sum --check --status
          echo '1d11ea3a05cac04aff727ec41509a66310991f60955214ff0eb609055f13269f  scripts/storage_preflight.py' | /usr/bin/sha256sum --check --status
      - name: Sign only a complete successful smoke report
        if: inputs.smoke_scope == 'all'
        working-directory: backend
        env:
          COMMERCIAL_PIPELINE_V2_ENABLED: ${{ vars.COMMERCIAL_PIPELINE_V2_ENABLED }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
          R2_PRESIGN_MAX_SECONDS: ${{ vars.R2_PRESIGN_MAX_SECONDS || '900' }}
          R2_TEMP_BUCKET: ${{ vars.R2_TEMP_BUCKET }}
          R2_FINAL_BUCKET: ${{ vars.R2_FINAL_BUCKET }}
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PORTFOLIO_AUDIO_STORAGE_BUCKET: ${{ vars.PORTFOLIO_AUDIO_STORAGE_BUCKET }}
          PRODUCAO_STORAGE_BUCKET: ${{ vars.PRODUCAO_STORAGE_BUCKET }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
          PROPOSTA_STORAGE_BACKEND: ${{ vars.PROPOSTA_STORAGE_BACKEND }}
          PRODUCTION_TEMP_STORAGE_BACKEND: ${{ vars.PRODUCTION_TEMP_STORAGE_BACKEND }}
          PRODUCTION_FINAL_STORAGE_BACKEND: ${{ vars.PRODUCTION_FINAL_STORAGE_BACKEND }}
          PUBLIC_IMAGE_STORAGE_BACKEND: ${{ vars.PUBLIC_IMAGE_STORAGE_BACKEND }}
          PORTFOLIO_AUDIO_STORAGE_BACKEND: ${{ vars.PORTFOLIO_AUDIO_STORAGE_BACKEND }}
          PROPOSAL_DOCUMENT_STORAGE_BACKEND: ${{ vars.PROPOSAL_DOCUMENT_STORAGE_BACKEND || 'legacy' }}
          STORAGE_PREFLIGHT_TARGET_SHA: ${{ inputs.target_sha }}
          STORAGE_ROLLOUT_AUTHORIZATION_REF: ${{ inputs.authorization_ref }}
          STORAGE_PREFLIGHT_EVIDENCE_HMAC_KEY: ${{ secrets.STORAGE_PREFLIGHT_EVIDENCE_HMAC_KEY }}
          STORAGE_PREFLIGHT_EVIDENCE_PATH: /tmp/storage-evidence.json
          PYTHON_EXECUTABLE: ${{ steps.setup-python.outputs.python-path }}
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
        run: '"$PYTHON_EXECUTABLE" -m scripts.storage_evidence /tmp/storage-smoke.json /tmp/storage-evidence.json'
      - name: Verify the signed evidence and effective configuration
        if: inputs.smoke_scope == 'all'
        working-directory: backend
        env:
          COMMERCIAL_PIPELINE_V2_ENABLED: ${{ vars.COMMERCIAL_PIPELINE_V2_ENABLED }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
          R2_PRESIGN_MAX_SECONDS: ${{ vars.R2_PRESIGN_MAX_SECONDS || '900' }}
          R2_TEMP_BUCKET: ${{ vars.R2_TEMP_BUCKET }}
          R2_FINAL_BUCKET: ${{ vars.R2_FINAL_BUCKET }}
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PORTFOLIO_AUDIO_STORAGE_BUCKET: ${{ vars.PORTFOLIO_AUDIO_STORAGE_BUCKET }}
          PRODUCAO_STORAGE_BUCKET: ${{ vars.PRODUCAO_STORAGE_BUCKET }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
          PROPOSTA_STORAGE_BACKEND: ${{ vars.PROPOSTA_STORAGE_BACKEND }}
          PRODUCTION_TEMP_STORAGE_BACKEND: ${{ vars.PRODUCTION_TEMP_STORAGE_BACKEND }}
          PRODUCTION_FINAL_STORAGE_BACKEND: ${{ vars.PRODUCTION_FINAL_STORAGE_BACKEND }}
          PUBLIC_IMAGE_STORAGE_BACKEND: ${{ vars.PUBLIC_IMAGE_STORAGE_BACKEND }}
          PORTFOLIO_AUDIO_STORAGE_BACKEND: ${{ vars.PORTFOLIO_AUDIO_STORAGE_BACKEND }}
          PROPOSAL_DOCUMENT_STORAGE_BACKEND: ${{ vars.PROPOSAL_DOCUMENT_STORAGE_BACKEND || 'legacy' }}
          STORAGE_PREFLIGHT_EVIDENCE_HMAC_KEY: ${{ secrets.STORAGE_PREFLIGHT_EVIDENCE_HMAC_KEY }}
          STORAGE_PREFLIGHT_EVIDENCE_PATH: /tmp/storage-evidence.json
          PYTHON_EXECUTABLE: ${{ steps.setup-python.outputs.python-path }}
          PYTHONPATH: ""
          PYTHONHOME: ""
          PYTHONNOUSERSITE: "1"
        run: '"$PYTHON_EXECUTABLE" -m scripts.storage_preflight --require-rollout-ready'
      - name: Publish sanitized, short-lived evidence
        if: success() && inputs.smoke_scope == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: storage-rollout-evidence-${{ github.run_id }}
          path: |
            /tmp/storage-smoke.json
            /tmp/storage-evidence.json
          retention-days: 1
          if-no-files-found: error
