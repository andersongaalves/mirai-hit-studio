name: Storage Integration Gate

on:
    workflow_dispatch:
    pull_request:
        branches: [main]
    push:
        branches: [main, phase/3.8-integration-gate]

permissions:
    contents: read

concurrency:
    group: storage-integration-${{ github.ref }}
    cancel-in-progress: true

jobs:
    storage-integration:
        runs-on: ubuntu-latest
        timeout-minutes: 35
        services:
            postgres:
                # Same official digest; a rerun uses the alternate registry if the shared quota fails.
                image: ${{ github.run_attempt > 1 && 'public.ecr.aws/docker/library/postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826' || 'docker.io/library/postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826' }}
                env:
                    POSTGRES_DB: mirai_portals_e2e_storage
                    POSTGRES_USER: mirai_integration
                    POSTGRES_PASSWORD: mirai_integration_disposable
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U mirai_integration -d mirai_portals_e2e_storage"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        env:
            APP_ENV: test
            DATABASE_URL: postgresql+psycopg2://mirai_integration:mirai_integration_disposable@127.0.0.1:5432/mirai_portals_e2e_storage
            MIRAI_PORTALS_E2E_DATABASE_URL: postgresql+psycopg2://mirai_integration:mirai_integration_disposable@127.0.0.1:5432/mirai_portals_e2e_storage
            MIRAI_PORTALS_E2E_ALLOW: POSTGRES_17_DISPOSABLE_ONLY
            API_NAME: Mirai storage integration
            API_VERSION: "2.0"
            DEBUG: "false"
            HOST: 127.0.0.1
            PORT: "8000"
            LOG_LEVEL: WARNING
            SECRET_KEY: storage-integration-only-secret
            ALGORITHM: HS256
            ACCESS_TOKEN_EXPIRE_MINUTES: "30"
            REFRESH_TOKEN_EXPIRE_DAYS: "7"
            ALLOWED_ORIGINS: http://localhost:4173
            BACKUP_FOLDER: /tmp/mirai-storage-integration
            BACKUP_KEEP_DAYS: "1"
            RATE_LIMIT_DB: /tmp/mirai-storage-integration-rate.sqlite3
            RESEND_API_KEY: test-only
            EMAIL_FROM: storage-integration@example.invalid
            ADMIN_EMAIL: storage-integration@example.invalid
            PUBLIC_API_URL: http://127.0.0.1:8000
            PUBLIC_FRONTEND_URL: http://localhost:4173
            AI_ENABLED: "false"
            AI_EMAIL_ENABLED: "false"
            # Disposable CI fixture for legacy-mode regression, not the Render runtime state.
            COMMERCIAL_PIPELINE_V2_ENABLED: "false"
            PUBLIC_IMAGE_STORAGE_BACKEND: memory
            PORTFOLIO_AUDIO_STORAGE_BACKEND: memory
            PRODUCTION_TEMP_STORAGE_BACKEND: memory
            PRODUCTION_FINAL_STORAGE_BACKEND: memory
            PROPOSAL_DOCUMENT_STORAGE_BACKEND: legacy

        steps:
            - name: Check out integration SHA
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Assert exact branch SHA and protected mode
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
                  if [[ "$GITHUB_EVENT_NAME" = "pull_request" ]]; then
                    test "$GITHUB_BASE_REF" = "main"
                  else
                    case "$GITHUB_REF_NAME" in
                      main|phase/3.8-integration-gate) ;;
                      *) exit 1 ;;
                    esac
                  fi
                  test "$COMMERCIAL_PIPELINE_V2_ENABLED" = "false"

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version-file: backend/.python-version
                  cache: pip
                  cache-dependency-path: |
                      backend/requirements.txt
                      backend/requirements-test.txt

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install test dependencies
              shell: bash
              run: |
                  set -euo pipefail
                  python -m pip install --disable-pip-version-check -r backend/requirements-test.txt
                  python -m pip install --disable-pip-version-check ruff==0.16.9
                  npm install --no-save --no-package-lock playwright@1.55.0
                  npx playwright install --with-deps chromium

            - name: Prepare disposable PostgreSQL 17
              working-directory: backend
              shell: bash
              env:
                  PGPASSWORD: mirai_integration_disposable
              run: |
                  set -euo pipefail
                  psql --host 127.0.0.1 --username mirai_integration --dbname mirai_portals_e2e_storage --set ON_ERROR_STOP=1 <<'SQL'
                  DO $$ BEGIN
                    IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
                      CREATE ROLE anon NOLOGIN;
                    END IF;
                    IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
                      CREATE ROLE authenticated NOLOGIN;
                    END IF;
                  END $$;
                  SQL
                  python -m scripts.bootstrap_database
                  python -m alembic upgrade head
                  python - <<'PY'
                  import os
                  from alembic.config import Config
                  from alembic.script import ScriptDirectory
                  from sqlalchemy import create_engine, text

                  heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
                  assert heads == ["b5d7f9a1c328"], heads
                  with create_engine(os.environ["DATABASE_URL"]).connect() as connection:
                      assert int(connection.execute(text("SHOW server_version_num")).scalar_one()) // 10000 == 17
                      assert connection.execute(text("SELECT version_num FROM alembic_version")).scalar_one() == heads[0]
                  print(f"postgresql=17 alembic_head={heads[0]}")
                  PY

            - name: Run Storage Core and provider boundary tests
              working-directory: backend
              shell: bash
              run: |
                  set -euo pipefail
                  for pattern in \
                    test_storage_core.py \
                    test_producao_r2_storage.py \
                    test_portfolio_image_storage.py \
                    test_portfolio_audio_storage_core.py \
                    test_storage_lifecycle.py \
                    test_storage_migration.py \
                    test_storage_preflight.py \
                    test_storage_environment_guard.py \
                    test_production_release_guard.py \
                    test_production_release_workflow.py \
                    test_storage_evidence.py \
                    test_storage_provider_smoke.py \
                    test_ci_postgres_workflows.py \
                    test_portfolio_mix_comparison.py; do
                      python -m unittest discover -s tests -p "$pattern" -v
                  done

            - name: Run portal and ownership regressions
              working-directory: backend
              shell: bash
              run: |
                  set -euo pipefail
                  for pattern in \
                    test_portal_produtor.py \
                    test_portal_produtor_operacao.py \
                    test_rate_limit_persistente.py \
                    test_dashboard.py \
                    test_portal_cliente.py \
                    test_usuarios.py \
                    test_audit_logs.py \
                    test_portal_cliente_operacao.py \
                    test_producao.py \
                    test_authenticated_checkout.py \
                    test_financeiro_admin.py \
                    test_ambiente_testes.py \
                    test_mercado_pago_webhooks.py \
                    test_http_cors_contract.py \
                    test_portal_config.py \
                    test_producao_mensagens.py \
                    test_servico_etapas.py \
                    test_proposta_service.py \
                    test_proposta_comercial.py \
                    test_proposta_snapshot.py \
                    test_orcamento_preco.py \
                    test_orcamento_retry_i2.py \
                    test_beat_catalog.py \
                    test_carteira_creditos.py \
                    test_credito_alocacao.py \
                    test_credito_producao.py \
                    test_repasse_base.py \
                    test_repasse_etapas.py \
                    test_producao_etapas.py \
                    test_combos.py \
                    test_cotas_arquivo.py \
                    test_politicas.py \
                    test_entrega_final.py \
                    test_contato_cliente_produtor.py \
                    test_catalogo_prazo.py \
                    test_promocoes.py \
                    test_portal_notificacoes.py \
                    test_portfolio_creditos.py \
                    test_portfolio_envios.py \
                    test_audio_tags.py \
                    test_recursos.py \
                    test_portfolio_taxonomy.py \
                    test_catalogo.py \
                    test_emails.py; do
                      python -m unittest discover -s tests -p "$pattern" -v
                  done

            - name: Run PostgreSQL 17 and real-browser E2E
              working-directory: backend
              shell: bash
              run: |
                  set -euo pipefail
                  python -m unittest discover -s tests -p 'test_commerce_policy_postgres.py' -v
                  python -m unittest discover -s tests -p 'test_beat_catalog_postgres.py' -v
                  python -m unittest discover -s tests -p 'test_classificacao_postgres.py' -v
                  python -m unittest discover -s tests -p 'test_portals_postgres_e2e.py' -v

            - name: Run Admin and portal browser regressions
              shell: bash
              run: |
                  set -euo pipefail
                  node frontend/tests/portfolio_admin.cjs
                  node frontend/tests/portfolio_submissions.cjs
                  node frontend/tests/audio_tags.cjs
                  node frontend/tests/service_credits.cjs
                  node frontend/tests/credit_allocations.cjs
                  node frontend/tests/stage_payouts.cjs
                  node frontend/tests/producoes.cjs
                  node frontend/tests/financeiro_admin.cjs
                  node frontend/tests/beat_preview.cjs
                  node frontend/tests/portfolio_public.cjs
                  node frontend/tests/public_accessibility.cjs
                  node frontend/tests/home_artists.cjs
                  node frontend/tests/home_mix_comparison.cjs
                  node frontend/tests/portal_produtor.cjs
                  node frontend/tests/portal_cliente.cjs
                  node frontend/tests/acesso.cjs
                  node frontend/tests/dashboard.cjs
                  node frontend/tests/admin_beat_licenses.cjs
                  node frontend/tests/checkout.cjs
                  node frontend/tests/public_contracting.cjs
                  node frontend/tests/proposta_comercial.cjs
                  node frontend/tests/usuarios.cjs
                  node frontend/tests/client_signup.cjs
                  node frontend/tests/portal_settings_admin.cjs
                  node frontend/tests/servico_etapas_admin.cjs
                  node frontend/tests/proposta_editor.cjs
                  node frontend/tests/proposta_catalogo.cjs
                  node frontend/tests/combos_admin.cjs
                  node frontend/tests/file_quotas.cjs
                  node frontend/tests/policies.cjs
                  node frontend/tests/catalogo.cjs
                  node frontend/tests/promocoes.cjs
                  node frontend/tests/portal_notifications.cjs
                  node frontend/tests/production_stages_admin.cjs
                  node frontend/tests/image_crop.cjs
                  # APL-S12-01: suites that previously ran only by hand.
                  node frontend/tests/admin_foundation.cjs
                  node frontend/tests/ai_chat.cjs
                  node frontend/tests/ai_inbox.cjs
                  node frontend/tests/analytics.cjs
                  node frontend/tests/auditoria.cjs
                  node frontend/tests/checkout_routing.cjs
                  node frontend/tests/clientes.cjs
                  node frontend/tests/creators.cjs
                  node frontend/tests/flows.cjs
                  node frontend/tests/media_games.cjs
                  node frontend/tests/newsletter_admin.cjs
                  node frontend/tests/newsletter_public.cjs
                  node frontend/tests/public_navigation.cjs
                  node frontend/tests/security.cjs
                  node frontend/tests/seo_content_h2.cjs
                  node frontend/tests/seo_technical.cjs
                  node frontend/tests/style_architecture.cjs
                  node frontend/tests/csp_enforced.cjs

            - name: Prove lifecycle and migration safety gates
              working-directory: backend
              shell: bash
              run: |
                  set -euo pipefail
                  lifecycle="$(python -m scripts.storage_lifecycle --database-url "$DATABASE_URL" --dry-run)"
                  inventory="$(python -m scripts.migrate_production_files --database-url "$DATABASE_URL" --mode inventory)"
                  python - "$lifecycle" "$inventory" <<'PY'
                  import json
                  import sys

                  lifecycle = json.loads(sys.argv[1])
                  inventory = json.loads(sys.argv[2])
                  assert lifecycle["mode"] == "dry-run"
                  assert lifecycle["deletions"] == 0
                  assert inventory["mode"] == "inventory"
                  assert inventory["deletions"] == 0
                  assert inventory["references_printed"] == 0
                  PY
                  preflight="$(python -m scripts.storage_preflight)"
                  python - "$preflight" <<'PY'
                  import json
                  import sys

                  report = json.loads(sys.argv[1])
                  assert report["provider_connectivity_probed"] is False
                  assert report["provider_connectivity_evidence_verified"] is False
                  assert report["commercial_pipeline_v2"] == "off"
                  assert report["evidence_status"] == "not_provided"
                  assert report["rollout_ready"] is False
                  assert all(
                      component["provider_accessible"] == "not_checked"
                      and component["smoke"] == "not_run"
                      for component in report["components"].values()
                  )
                  PY
                  if python -m scripts.storage_preflight --require-rollout-ready; then
                      echo "storage rollout gate unexpectedly passed without provider smoke" >&2
                      exit 1
                  fi
                  if python -m scripts.migrate_production_files \
                    --database-url "$DATABASE_URL" --mode copy --confirm-copy; then
                      echo "migration copy unexpectedly enabled" >&2
                      exit 1
                  fi

            - name: Run focused static checks
              shell: bash
              run: |
                  set -euo pipefail
                  python -m compileall -q backend
                  (
                    cd backend
                    python - <<'PY'
                  from sqlalchemy.orm import configure_mappers
                  import models
                  configure_mappers()
                  print("configure_mappers=passed")
                  PY
                  )
                  ruff check --select E4,E7,E9,F \
                    backend/services/repasse_base_service.py \
                    backend/services/repasse_etapa_service.py \
                    backend/models/repasse_etapa.py \
                    backend/routers/repasse_etapa.py \
                    backend/schemas/repasse_etapa.py \
                    backend/tests/test_repasse_base.py \
                    backend/tests/test_repasse_etapas.py \
                    backend/services/storage \
                    backend/services/producao_arquivo_storage.py \
                    backend/services/producao_arquivo_service.py \
                    backend/services/portfolio_audio_storage_core.py \
                    backend/scripts/storage_lifecycle.py \
                    backend/scripts/migrate_production_files.py \
                    backend/scripts/storage_preflight.py \
                    backend/scripts/storage_environment_guard.py \
                    backend/scripts/production_release_guard.py \
                    backend/scripts/storage_evidence.py \
                    backend/scripts/storage_provider_smoke.py \
                    backend/tests/test_storage_core.py \
                    backend/tests/test_producao_r2_storage.py \
                    backend/tests/test_portfolio_image_storage.py \
                    backend/tests/test_portfolio_audio_storage_core.py \
                    backend/tests/test_storage_lifecycle.py \
                    backend/tests/test_storage_migration.py \
                    backend/tests/test_storage_preflight.py \
                    backend/tests/test_storage_environment_guard.py \
                    backend/tests/test_production_release_guard.py \
                    backend/tests/test_production_release_workflow.py \
                    backend/tests/test_storage_evidence.py \
                    backend/tests/test_storage_provider_smoke.py \
                    backend/tests/test_ci_postgres_workflows.py
                  ruff check --select E4,E7,E9,F \
                    backend/models/beat.py \
                    backend/routers/beats.py \
                    backend/schemas/beat.py \
                    backend/services/beat_service.py \
                    backend/services/beat_upload_config_service.py \
                    backend/tests/test_beat_catalog.py \
                    backend/tests/test_beat_catalog_postgres.py \
                    backend/migrations/versions/d7a2c4e6f810_catalogo_beats.py \
                    backend/migrations/versions/e2b4c6d8f901_beat_formats_review.py \
                    backend/migrations/versions/f3c5d7e9a102_beat_upload_limits.py \
                    backend/migrations/versions/a4c6e8f0b217_beat_reserva_prazo.py \
                    backend/migrations/versions/b5d7f9a1c328_limites_persistentes.py \
                    backend/services/rate_limit_service.py \
                    backend/core/http_security.py \
                    backend/routers/auth.py
                  node --check frontend/js/admin/projetos.js
                  node --check frontend/tests/portfolio_admin.cjs
                  node --check frontend/tests/portal_produtor.cjs
                  node --check frontend/tests/portal_cliente.cjs
                  node --check frontend/js/admin/beats.js
                  node --check frontend/js/acesso.js
                  node --check frontend/js/auth_next.js
                  node --check frontend/js/admin/auth.js
                  node --check frontend/tests/support/access.cjs
                  node --check frontend/tests/admin_beat_licenses.cjs
                  node --check frontend/js/modules/beat_upload_validation.js
                  node --check frontend/js/admin/propostas/proposta_mapper.js
                  node --check frontend/tests/proposta_catalogo.cjs
                  node --check frontend/js/pix.js
                  node --check frontend/js/checkout.js
                  node --check frontend/tests/checkout.cjs
                  node --check frontend/js/modules/stage_payouts.js
                  node --check frontend/tests/stage_payouts.cjs
                  node --check frontend/tests/financeiro_admin.cjs
                  node --check frontend/js/admin/financeiro/financeiro.js
                  git diff --check origin/main...HEAD

            - name: Verify disposable data cleanup
              if: always()
              shell: bash
              env:
                  PGPASSWORD: mirai_integration_disposable
              run: |
                  set +e
                  remaining="$(psql --host 127.0.0.1 --username mirai_integration --dbname mirai_portals_e2e_storage --tuples-only --no-align --command "
                    SELECT
                      (SELECT count(*) FROM usuarios) +
                      (SELECT count(*) FROM clientes) +
                      (SELECT count(*) FROM orcamentos) +
                      (SELECT count(*) FROM producoes) +
                      (SELECT count(*) FROM producao_arquivos) +
                      (SELECT count(*) FROM credito_contrato_itens) +
                      (SELECT count(*) FROM credito_lotes) +
                      (SELECT count(*) FROM credito_lancamentos) +
                      (SELECT count(*) FROM credito_alocacoes) +
                      (SELECT count(*) FROM credito_movimentos) +
                      (SELECT count(*) FROM credito_etapas) +
                      (SELECT count(*) FROM repasse_etapas) +
                      (SELECT count(*) FROM repasse_etapa_pagamentos) +
                      (SELECT count(*) FROM portal_notificacoes) +
                      (SELECT count(*) FROM repasses_produtor);
                  " 2>/dev/null | tr -d '[:space:]')"
                  if [[ -n "$remaining" && "$remaining" != "0" ]]; then
                    echo "storage_integration_cleanup_failed remaining=$remaining" >&2
                    exit 1
                  fi
                  rm -f /tmp/mirai-storage-integration-rate.sqlite3

            - name: Publish sanitized result
              if: success()
              shell: bash
              run: |
                  {
                    echo "### Storage integration gate"
                    echo "- Exact integration SHA: $GITHUB_SHA"
                    echo "- PostgreSQL 17 and Alembic b5d7f9a1c328: passed"
                    echo "- FastAPI and Playwright E2E: passed"
                    echo "- R2, Cloudinary and Supabase: provider-boundary fakes passed"
                    echo "- Storage rollout preflight: sanitized config report; no live connectivity claim"
                    echo "- Lifecycle: dry-run only, zero deletions"
                    echo "- Migration: inventory only; copy gate remained disabled"
                    echo "- Commercial pipeline V2: off"
                    echo "- Production providers, data and secrets: not used"
                  } >> "$GITHUB_STEP_SUMMARY"
