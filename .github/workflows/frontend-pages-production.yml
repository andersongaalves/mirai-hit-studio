name: Frontend-only Cloudflare Pages Production Publish

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main commit to publish
        required: true
        type: string
      authorization_ref:
        description: Fresh authorization reference for this one-time frontend publication
        required: true
        type: string

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: frontend-pages-production-publish
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ inputs.target_sha }}
  AUTHORIZATION_REF: ${{ inputs.authorization_ref }}

jobs:
  request-guard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate trusted main workflow and exact target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/frontend-pages-production.yml@refs/heads/main"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$TARGET_SHA" = "$GITHUB_SHA"
          [[ "$AUTHORIZATION_REF" =~ ^CTRL-[A-Za-z0-9._-]{3,100}$ ]]

          gh api "repos/$GITHUB_REPOSITORY/compare/$TARGET_SHA...$GITHUB_SHA" > /tmp/main-target-ancestry.json
          python - <<'PY'
          import json
          with open('/tmp/main-target-ancestry.json', encoding='utf-8') as source:
              status = json.load(source).get('status')
          if status not in {'ahead', 'identical'}:
              raise SystemExit('authorized_frontend_sha_not_in_main_history')
          PY

          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100" > /tmp/target-workflow-runs.json
          python - <<'PY'
          import json
          import os
          required = {'Storage Integration Gate', 'Portals E2E PostgreSQL 17'}
          with open('/tmp/target-workflow-runs.json', encoding='utf-8') as source:
              runs = json.load(source).get('workflow_runs', [])
          passed = {
              run.get('name')
              for run in runs
              if run.get('head_sha') == os.environ['TARGET_SHA']
              and run.get('head_branch') == 'main'
              and run.get('status') == 'completed'
              and run.get('conclusion') == 'success'
          }
          missing = required - passed
          if missing:
              raise SystemExit('required_ci_not_successful_for_target_sha: ' + ','.join(sorted(missing)))
          PY

  publish-frontend:
    needs: request-guard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-pages-production
    outputs:
      deployment_id: ${{ steps.verify.outputs.deployment_id }}
      deployment_url: ${{ steps.verify.outputs.deployment_url }}
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - name: Confirm main still matches the publication request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_sha" = "$TARGET_SHA"

      - name: Check out only the authorized frontend SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -d frontend
          test -z "$(git status --porcelain)"

      - name: Verify Pages project, production branch, domain, and no prior publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/mirai-hit-studio" \
            > /tmp/pages-project.json
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/mirai-hit-studio/deployments?env=production&per_page=25&page=1" \
            > /tmp/pages-production-deployments-1.json
          pages="$(jq -er '.result_info.total_pages | select(type == "number" and . >= 1 and . <= 1000)' /tmp/pages-production-deployments-1.json)"
          export PAGES_COUNT="$pages"
          for ((page=2; page<=pages; page++)); do
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/mirai-hit-studio/deployments?env=production&per_page=25&page=$page" \
              > "/tmp/pages-production-deployments-$page.json"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          with Path('/tmp/pages-project.json').open(encoding='utf-8') as source:
              response = json.load(source)
          if not response.get('success'):
              raise SystemExit('cloudflare_pages_project_read_failed')
          project = response['result']
          source = project.get('source') or {}
          source_config = source.get('config') or {}
          expected_domains = {'miraihitstudio.com.br', 'www.miraihitstudio.com.br'}
          if project.get('name') != 'mirai-hit-studio':
              raise SystemExit('unexpected_cloudflare_pages_project')
          if source.get('type') != 'github' or source_config.get('owner') != 'andersongaalves' or source_config.get('repo_name') != 'mirai-hit-studio':
              raise SystemExit('unexpected_cloudflare_pages_repository')
          if source_config.get('production_branch') != 'main' or project.get('production_branch') != 'main':
              raise SystemExit('unexpected_cloudflare_production_branch')
          if source_config.get('production_deployments_enabled') is not False:
              raise SystemExit('automatic_production_deploy_state_changed')
          if not expected_domains.issubset(set(project.get('domains') or [])):
              raise SystemExit('expected_production_domain_not_attached')

          pages = int(os.environ['PAGES_COUNT'])
          for page in range(1, pages + 1):
              with Path(f'/tmp/pages-production-deployments-{page}.json').open(encoding='utf-8') as source:
                  response = json.load(source)
              info = response.get('result_info') or {}
              if not response.get('success') or info.get('page') != page or info.get('total_pages') != pages:
                  raise SystemExit('cloudflare_pages_deployment_history_read_failed')
              for deployment in response.get('result') or []:
                  metadata = (deployment.get('deployment_trigger') or {}).get('metadata') or {}
                  if metadata.get('commit_hash') == os.environ['TARGET_SHA'] and not deployment.get('is_skipped'):
                      raise SystemExit('deployment_attempt_for_authorized_sha_already_exists')
          PY

      - name: Publish the exact frontend once
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          npm_config_cache: /tmp/mirai-pages-npm-cache
        shell: bash
        run: >-
          npx --yes wrangler@4.149.0 pages deploy frontend
          --project-name mirai-hit-studio
          --branch main
          --commit-hash "$TARGET_SHA"

      - name: Verify production deployment, domain, and public routes
        id: verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          verified=''
          for attempt in $(seq 1 24); do
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/mirai-hit-studio" \
              > /tmp/pages-project-current.json
            set +e
            verified="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          with Path('/tmp/pages-project-current.json').open(encoding='utf-8') as source:
              response = json.load(source)
          if not response.get('success'):
              raise SystemExit(2)
          project = response['result']
          canonical = project.get('canonical_deployment') or {}
          metadata = (canonical.get('deployment_trigger') or {}).get('metadata') or {}
          if metadata.get('commit_hash') != os.environ['TARGET_SHA']:
              raise SystemExit(3)
          if canonical.get('environment') != 'production' or canonical.get('is_skipped'):
              raise SystemExit(4)
          status = (canonical.get('latest_stage') or {}).get('status')
          if status in {'failure', 'canceled', 'skipped'}:
              raise SystemExit(4)
          if status != 'success':
              raise SystemExit(3)

          aliases = set(canonical.get('aliases') or [])
          if 'https://miraihitstudio.com.br' not in aliases:
              raise SystemExit(6)
          print(json.dumps({'id': canonical['id'], 'url': canonical['url']}))
          PY
          )"
            result=$?
            set -e
            if [ "$result" -eq 0 ]; then
              break
            elif [ "$result" -eq 3 ]; then
              sleep 5
            else
              exit "$result"
            fi
          done
          test -n "$verified"
          deployment_id="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["id"])' "$verified")"
          deployment_url="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["url"])' "$verified")"
          [[ "$deployment_id" =~ ^[A-Za-z0-9-]+$ ]]
          [[ "$deployment_url" =~ ^https://[A-Za-z0-9.-]+\.mirai-hit-studio\.pages\.dev$ ]]
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

          for path in / /portfolio /acesso; do
            code="$(curl --location --max-redirs 3 --silent --output /dev/null --write-out '%{http_code}' "https://miraihitstudio.com.br$path")"
            test "$code" = "200"
          done

          {
            echo "## Frontend Cloudflare Pages publication"
            echo "- SHA: `$TARGET_SHA`"
            echo "- Authorization reference: `$AUTHORIZATION_REF`"
            echo "- Triggered by: `$GITHUB_ACTOR` (Actions run `$GITHUB_RUN_ID`)"
            echo "- Environment: production"
            echo "- Deployment ID: `$deployment_id`"
            echo "- Deployment URL: $deployment_url"
            echo "- Production domain: https://miraihitstudio.com.br (home, /portfolio, /acesso returned HTTP 200)"
            echo "- Backend/Render: not deployed by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
