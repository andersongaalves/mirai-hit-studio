name: Portals E2E PostgreSQL 17

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - ".github/workflows/portals-e2e.yml"
            - "backend/routers/portal_*.py"
            - "backend/routers/producao.py"
            - "backend/routers/usuarios.py"
            - "backend/routers/client_access.py"
            - "backend/routers/auth.py"
            - "backend/core/dependencies.py"
            - "backend/core/security.py"
            - "backend/services/portal_*.py"
            - "backend/services/producao_arquivo*.py"
            - "backend/services/repasse_produtor_service.py"
            - "backend/services/portfolio_segments_service.py"
            - "backend/services/client_access_service.py"
            - "backend/models/config.py"
            - "backend/models/usuario.py"
            - "backend/migrations/versions/*auth_version*"
            - "backend/schemas/config.py"
            - "backend/routers/config.py"
            - "backend/models/portal_produtor.py"
            - "backend/tests/test_portal*.py"
            - "backend/tests/test_portfolio_segments.py"
            - "backend/tests/test_client_access.py"
            - "backend/tests/test_client_signup.py"
            - "backend/tests/test_password_recovery.py"
            - "backend/services/email_service.py"
            - "backend/templates/email_confirmacao_cadastro.html"
            - "backend/templates/email_recuperacao_senha.html"
            - "backend/tests/commercial_i2_support.py"
            - "frontend/portal-*.html"
            - "frontend/js/produtor/**"
            - "frontend/js/cliente/**"
            - "frontend/js/admin/auth.js"
            - "frontend/js/admin/configuracoes.js"
            - "frontend/js/admin/projetos.js"
            - "frontend/tests/portfolio_segments.cjs"
            - "frontend/tests/auth_sessions.cjs"
            - "frontend/tests/client_access.cjs"
            - "frontend/tests/client_signup.cjs"
            - "frontend/tests/client_signup_postgres_e2e.cjs"
            - "frontend/tests/password_recovery*.cjs"
            - "frontend/tests/portals_postgres_e2e.cjs"
            - "frontend/acesso.html"
            - "frontend/ativar.html"
            - "frontend/cadastro.html"
            - "frontend/recuperar-senha.html"
            - "frontend/redefinir-senha.html"
            - "frontend/js/acesso.js"
            - "frontend/js/ativar.js"
            - "frontend/js/cadastro.js"
            - "frontend/js/recuperar-senha.js"
            - "frontend/js/redefinir-senha.js"
            - "frontend/_redirects"

permissions:
    contents: read

concurrency:
    group: portals-e2e-${{ github.ref }}
    cancel-in-progress: true

jobs:
    portals-e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_DB: mirai_portals_e2e
                    POSTGRES_USER: mirai_e2e
                    POSTGRES_PASSWORD: mirai_e2e_disposable
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U mirai_e2e -d mirai_portals_e2e"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        env:
            APP_ENV: test
            DATABASE_URL: postgresql+psycopg2://mirai_e2e:mirai_e2e_disposable@127.0.0.1:5432/mirai_portals_e2e
            MIRAI_PORTALS_E2E_DATABASE_URL: postgresql+psycopg2://mirai_e2e:mirai_e2e_disposable@127.0.0.1:5432/mirai_portals_e2e
            MIRAI_PORTALS_E2E_ALLOW: POSTGRES_17_DISPOSABLE_ONLY
            API_NAME: Mirai portals E2E
            API_VERSION: "2.0"
            DEBUG: "false"
            HOST: 127.0.0.1
            PORT: "8000"
            LOG_LEVEL: WARNING
            SECRET_KEY: portals-e2e-only-secret-not-used-outside-runner
            ALGORITHM: HS256
            ACCESS_TOKEN_EXPIRE_MINUTES: "30"
            REFRESH_TOKEN_EXPIRE_DAYS: "7"
            ALLOWED_ORIGINS: http://localhost:4173
            BACKUP_FOLDER: /tmp/mirai-portals-e2e
            BACKUP_KEEP_DAYS: "1"
            RATE_LIMIT_DB: /tmp/mirai-portals-e2e-rate.sqlite3
            RESEND_API_KEY: test-only
            EMAIL_FROM: portals-e2e@example.invalid
            ADMIN_EMAIL: portals-e2e@example.invalid
            PUBLIC_API_URL: http://127.0.0.1:8000
            PUBLIC_FRONTEND_URL: http://localhost:4173
            AI_ENABLED: "false"
            AI_EMAIL_ENABLED: "false"

        steps:
            - name: Check out source
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version-file: backend/.python-version
                  cache: pip
                  cache-dependency-path: |
                      backend/requirements.txt
                      backend/requirements-test.txt

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install backend and browser dependencies
              shell: bash
              run: |
                  set -euo pipefail
                  python -m pip install --disable-pip-version-check -r backend/requirements-test.txt
                  python -m pip install --disable-pip-version-check ruff==0.16.9
                  npm install --no-save --no-package-lock playwright@1.55.0
                  npx playwright install --with-deps chromium

            - name: Prepare isolated PostgreSQL 17 schema
              working-directory: backend
              shell: bash
              env:
                  PGPASSWORD: mirai_e2e_disposable
              run: |
                  set -euo pipefail
                  psql --host 127.0.0.1 --username mirai_e2e --dbname mirai_portals_e2e --set ON_ERROR_STOP=1 <<'SQL'
                  DO $$ BEGIN
                    IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
                      CREATE ROLE anon NOLOGIN;
                    END IF;
                    IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
                      CREATE ROLE authenticated NOLOGIN;
                    END IF;
                  END $$;
                  SQL
                  python -m scripts.bootstrap_database
                  python -m alembic upgrade head
                  python - <<'PY'
                  from alembic.config import Config
                  from alembic.script import ScriptDirectory
                  from sqlalchemy import create_engine, text
                  import os

                  config = Config("alembic.ini")
                  script = ScriptDirectory.from_config(config)
                  heads = script.get_heads()
                  assert len(heads) == 1, heads
                  with create_engine(os.environ["DATABASE_URL"]).connect() as connection:
                      assert int(connection.execute(text("SHOW server_version_num")).scalar_one()) // 10000 == 17
                      assert connection.execute(text("SELECT version_num FROM alembic_version")).scalar_one() == heads[0]
                  print(f"postgresql=17 alembic_head={heads[0]}")
                  PY

            - name: Run focused portal regressions
              working-directory: backend
              shell: bash
              run: |
                  set -euo pipefail
                  python -m unittest discover -s tests -p 'test_portal_produtor.py' -v
                  python -m unittest discover -s tests -p 'test_portal_produtor_operacao.py' -v
                  python -m unittest discover -s tests -p 'test_portal_cliente.py' -v
                  python -m unittest discover -s tests -p 'test_portal_cliente_operacao.py' -v
                  python -m unittest discover -s tests -p 'test_portfolio_segments.py' -v
                  python -m unittest discover -s tests -p 'test_client_access.py' -v
                  python -m unittest discover -s tests -p 'test_client_signup.py' -v
                  python -m unittest discover -s tests -p 'test_password_recovery.py' -v

            - name: Run isolated browser auth regression
              shell: bash
              run: |
                  node frontend/tests/auth_sessions.cjs
                  node frontend/tests/client_access.cjs
                  node frontend/tests/client_signup.cjs
                  node frontend/tests/password_recovery.cjs

            - name: Run PostgreSQL 17 and real-browser E2E
              working-directory: backend
              shell: bash
              run: |
                  set -euo pipefail
                  python -m unittest discover -s tests -p 'test_portals_postgres_e2e.py' -v

            - name: Run focused static checks
              shell: bash
              run: |
                  set -euo pipefail
                  python -m compileall -q backend
                  (
                    cd backend
                    python - <<'PY'
                  from sqlalchemy.orm import configure_mappers
                  import models
                  configure_mappers()
                  print("configure_mappers=passed")
                  PY
                  )
                  ruff check backend/tests/test_portals_postgres_e2e.py
                  ruff check backend/services/portfolio_segments_service.py backend/tests/test_portfolio_segments.py
                  ruff check --ignore B008 backend/services/client_access_service.py backend/routers/client_access.py backend/schemas/client_access.py backend/tests/test_client_access.py backend/tests/test_client_signup.py
                  ruff check --ignore B008 backend/tests/test_password_recovery.py backend/core/dependencies.py backend/routers/auth.py backend/models/usuario.py
                  ruff check --select E4,E7,E9,F backend/tests/commercial_i2_support.py
                  node --check frontend/tests/portals_postgres_e2e.cjs
                  node --check frontend/tests/auth_sessions.cjs
                  node --check frontend/tests/client_access.cjs
                  node --check frontend/tests/client_signup.cjs
                  node --check frontend/tests/client_signup_postgres_e2e.cjs
                  node --check frontend/tests/password_recovery.cjs
                  node --check frontend/tests/password_recovery_postgres_e2e.cjs
                  node --check frontend/js/ativar.js
                  node --check frontend/js/cadastro.js
                  node --check frontend/js/recuperar-senha.js
                  node --check frontend/js/redefinir-senha.js
                  node --check frontend/js/admin/auth.js
                  git diff --check

            - name: Verify synthetic cleanup
              if: always()
              shell: bash
              env:
                  PGPASSWORD: mirai_e2e_disposable
              run: |
                  set +e
                  remaining="$(psql --host 127.0.0.1 --username mirai_e2e --dbname mirai_portals_e2e --tuples-only --no-align --command "
                    SELECT
                      (SELECT count(*) FROM usuarios) +
                      (SELECT count(*) FROM clientes) +
                      (SELECT count(*) FROM orcamentos) +
                      (SELECT count(*) FROM producoes) +
                      (SELECT count(*) FROM producao_arquivos) +
                      (SELECT count(*) FROM repasses_produtor);
                  " 2>/dev/null | tr -d '[:space:]')"
                  if [[ -n "$remaining" && "$remaining" != "0" ]]; then
                    echo "portals_e2e_cleanup_failed remaining=$remaining" >&2
                    exit 1
                  fi
                  rm -f /tmp/mirai-portals-e2e-rate.sqlite3

            - name: Publish sanitized result
              if: success()
              shell: bash
              run: |
                  {
                    echo "### Portals E2E"
                    echo "- PostgreSQL 17: passed"
                    echo "- Alembic single head: passed"
                    echo "- Backend portal matrix: passed"
                    echo "- Browser connected to real FastAPI/PostgreSQL: passed"
                    echo "- Storage: integrated fake (no production bucket)"
                    echo "- Frontend services contract: Home #servicos"
                    echo "- Production data and secrets: not used"
                  } >> "$GITHUB_STEP_SUMMARY"
