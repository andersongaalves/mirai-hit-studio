<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex,nofollow,noarchive" />
        <meta name="referrer" content="no-referrer" />
        <title>Ativar acesso | Mirai Hit Studio</title>
        <link rel="stylesheet" href="/css/main.css" />
        <link rel="stylesheet" href="/css/components/portal-entry.css" />
        <link rel="stylesheet" href="/css/integrado.css?v=20261012-style-architecture" />
        <link rel="stylesheet" href="/css/pages/integrado-auth.css" />
        <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png" />
    </head>
    <body class="producer-body integrado-auth">
        <a class="skip-link" href="#activation-content">Ir para o conteúdo</a>
        <header class="integrado-auth__header">
            <a class="integrado-auth__brand" href="/" aria-label="Mirai Hit Studio, página inicial"><img src="/assets/mirai-logo-header-symbol.svg" alt="" width="45" height="32" /><img src="/assets/mirai-logo-header-lettering.svg" alt="" width="110" height="14" /></a>
            <a href="/acesso">Voltar</a>
        </header>
        <main class="producer-entry" id="activation-content">
            <aside class="integrado-auth__intro" aria-label="Mirai Hit Studio">
                <div class="integrado-auth__logo" aria-hidden="true"><img src="/assets/mirai-logo-symbol.svg" alt="" width="154" height="108" /><img src="/assets/mirai-logo-lettering.svg" alt="" width="270" height="32" /><span>STUDIO</span></div>
                <p>Acompanhe propostas, produções e entregas.</p>
            </aside>
            <section class="producer-login" aria-labelledby="activation-title">
                <div>
                    <h1 id="activation-title">Ative seu acesso.</h1>
                    <p id="activation-lead" class="producer-lead">Validando seu link...</p>
                </div>
                <form id="activation-form" class="producer-login__form hidden">
                    <label for="activation-username">Nome de usuário</label>
                    <input id="activation-username" name="username" autocomplete="username" maxlength="50" required />
                    <label for="activation-password">Senha</label>
                    <input id="activation-password" name="password" type="password" autocomplete="new-password" placeholder="••••••••••••" minlength="8" maxlength="72" required />
                    <button class="integrado-auth__password-toggle" type="button" data-password-toggle="activation-password" aria-pressed="false"><img src="/assets/mirai-integrado-eye.svg" width="18" height="18" alt="" /><span>Mostrar senha</span></button>
                    <p class="integrado-auth__hint">Use uma senha longa e diferente das outras contas.</p>
                    <label for="activation-confirm">Confirmar senha</label>
                    <input id="activation-confirm" name="confirm" type="password" autocomplete="new-password" placeholder="••••••••••••" minlength="8" maxlength="72" required />
                    <button class="integrado-auth__password-toggle" type="button" data-password-toggle="activation-confirm" aria-pressed="false"><img src="/assets/mirai-integrado-eye.svg" width="18" height="18" alt="" /><span>Mostrar confirmação</span></button>
                    <button class="btn-cta" type="submit">Ativar acesso</button>
                </form>
                <p id="activation-message" class="producer-message hidden" role="status"></p>
                <a id="activation-login" class="btn-cta hidden" href="/acesso">Entrar na sua conta</a>
            </section>
        </main>
        <footer class="integrado-auth__footer">Mirai Hit Studio · Privacidade</footer>
        <script type="module" src="/js/integrado_auth.js"></script>
        <script type="module" src="/js/ativar.js"></script>
    </body>
</html>
