<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex,nofollow,noarchive" />
        <title>Área de acesso | Mirai Hit Studio</title>
        <link rel="stylesheet" href="/css/main.css" />
        <link rel="stylesheet" href="/css/pages/produtor.css" />
        <link rel="stylesheet" href="/css/integrado.css" />
        <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png" />
    </head>
    <body class="producer-body integrado-auth integrado-auth--access">
        <a class="skip-link" href="#access-content">Ir para o conteúdo</a>
        <header class="integrado-auth__header">
            <a class="integrado-auth__brand" href="/" aria-label="Mirai Hit Studio, página inicial"><img src="/assets/mirai-logo-header-symbol.svg" alt="" width="45" height="32" /><img src="/assets/mirai-logo-header-lettering.svg" alt="" width="110" height="14" /></a>
            <a href="/">Voltar</a>
        </header>
        <main class="producer-entry" id="access-content">
            <aside class="integrado-auth__intro" aria-label="Mirai Hit Studio">
                <div class="integrado-auth__logo" aria-hidden="true"><img src="/assets/mirai-logo-symbol.svg" alt="" width="154" height="108" /><img src="/assets/mirai-logo-lettering.svg" alt="" width="270" height="32" /><span>STUDIO</span></div>
                <p>Acompanhe propostas, produções e entregas.</p>
            </aside>
            <section class="producer-login" aria-labelledby="access-title">
                <div>
                    <h1 id="access-title">Entre no seu espaço.</h1>
                    <p class="producer-lead">Um acesso para clientes, produtores e equipe Mirai.</p>
                </div>
                <form id="access-login-form" class="producer-login__form">
                    <div class="integrado-auth__field">
                        <label for="username">Usuário</label>
                        <input id="username" name="username" autocomplete="username" placeholder="Seu usuário" required />
                    </div>
                    <div class="integrado-auth__field">
                        <label for="password">Senha</label>
                        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••••••" required />
                        <button class="integrado-auth__password-toggle" type="button" data-password-toggle="password" aria-pressed="false"><img src="/assets/mirai-integrado-eye.svg" width="18" height="18" alt="" /><span>Mostrar senha</span></button>
                    </div>
                    <a class="integrado-auth__forgot" href="/recuperar-senha">Esqueci minha senha</a>
                    <button class="btn-cta" type="submit">Entrar</button>
                    <p id="login-error" class="producer-message producer-message--error hidden" role="alert"></p>
                </form>
                <div class="integrado-auth__signup">
                    <p class="producer-login__secondary">Ainda não tem acesso?</p>
                    <a href="/cadastro">Criar conta</a>
                </div>
            </section>
        </main>
        <footer class="integrado-auth__footer">Mirai Hit Studio · Privacidade</footer>
        <script type="module" src="/js/integrado_auth.js"></script>
        <script type="module" src="/js/acesso.js"></script>
    </body>
</html>
